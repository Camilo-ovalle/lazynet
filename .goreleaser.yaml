# GoReleaser v2 — builds static binaries, tarballs, .deb/.rpm packages and
# the GitHub release. The APT repository is published by release.yml.
version: 2
project_name: lazynet

before:
  hooks:
    - go mod tidy
    - go test ./...
    - sh -c 'mkdir -p completions && for sh in bash zsh fish; do go run ./cmd/lazynet completion $sh > completions/lazynet.$sh; done'

builds:
  - id: lazynet
    main: ./cmd/lazynet
    binary: lazynet
    env:
      - CGO_ENABLED=0 # fully static: no runtime dependencies at all
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/Camilo-ovalle/lazynet/internal/cli.Version={{ .Version }}
      - -X github.com/Camilo-ovalle/lazynet/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/Camilo-ovalle/lazynet/internal/cli.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - README.es.md
      - CHANGELOG.md
      - completions/*

checksum:
  name_template: checksums.txt

nfpms:
  - id: packages
    package_name: lazynet
    vendor: Camilo Enrique Ovalle Ceron
    homepage: https://github.com/Camilo-ovalle/lazynet
    maintainer: Camilo Enrique Ovalle Ceron <noreply@github.com>
    license: Apache-2.0
    description: |-
      Lazy terminal UI and CLI for Cisco Catalyst, Nexus and ASA.
      Read-only by default; VLAN changes always require confirmation.
    formats: [deb, rpm]
    bindir: /usr/bin
    section: net
    priority: optional
    contents:
      - src: completions/lazynet.bash
        dst: /usr/share/bash-completion/completions/lazynet
      - src: completions/lazynet.zsh
        dst: /usr/share/zsh/vendor-completions/_lazynet
      - src: completions/lazynet.fish
        dst: /usr/share/fish/vendor_completions.d/lazynet.fish
      - src: LICENSE
        dst: /usr/share/doc/lazynet/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/lazynet/NOTICE
      - src: CHANGELOG.md
        dst: /usr/share/doc/lazynet/CHANGELOG.md

# Release notes come from CHANGELOG.md (release.yml passes --release-notes).
# This commit list is only used by snapshot builds.
changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

release:
  github:
    owner: Camilo-ovalle
    name: lazynet
