# Unified Cisco platform used for every lazynet session. Prompt patterns cover
# IOS, IOS-XE, NX-OS and ASA so a single session can run `show version`, detect
# the platform, and then apply the right terminal settings. No on-open
# commands: lazynet checks the privilege level itself and fails fast at '>'.
platform-type: 'lazynet_cisco'
default:
  driver-type: 'network'
  privilege-levels:
    exec:
      name: 'exec'
      pattern: '(?im)^[\w.\-@/:]{1,63}>\s?$'
      previous-priv:
      deescalate:
      escalate:
      escalate-auth: false
      escalate-prompt:
    privilege-exec:
      name: 'privilege-exec'
      pattern: '(?im)^[\w.\-@/:]{1,63}#\s?$'
      previous-priv: 'exec'
      deescalate: 'disable'
      escalate: 'enable'
      escalate-auth: true
      escalate-prompt: '(?im)^(?:enable\s){0,1}password:\s?$'
    configuration:
      name: 'configuration'
      pattern: '(?im)^[\w.\-@/:]{1,63}\(config[\w.\-@/:+]{0,32}\)#\s?$'
      not-contains:
        - 'tcl)'
        - 'config-s'
      previous-priv: 'privilege-exec'
      deescalate: 'end'
      escalate: 'configure terminal'
      escalate-auth: false
      escalate-prompt:
  default-desired-privilege-level: 'privilege-exec'
  failed-when-contains:
    - '% Ambiguous command'
    - '% Incomplete command'
    - '% Invalid input detected'
    - '% Unknown command'
    - '% Invalid command'
    - 'ERROR: %'
    - '% Authorization failed'
