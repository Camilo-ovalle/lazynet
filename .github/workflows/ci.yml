name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: build (static)
        run: CGO_ENABLED=0 go build -trimpath -o lazynet ./cmd/lazynet && ./lazynet version
      - name: shellcheck
        run: shellcheck scripts/*.sh

  # Builds every package with GoReleaser (snapshot, nothing is published) and
  # installs lazynet the way users will: from a signed APT repository and with
  # install.sh. Catches packaging and repository problems before a release.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Build a signed APT repository with a throwaway key
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
          gpg --batch --passphrase '' --quick-gen-key "lazynet CI <ci@invalid>" rsa3072 sign never
          APT_GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}') \
            sh scripts/build-apt-repo.sh dist _apt
      - name: apt install lazynet
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _apt >/dev/null 2>&1 &
          sleep 1
          sudo install -m 0644 _apt/lazynet.gpg /usr/share/keyrings/lazynet.gpg
          echo "deb [signed-by=/usr/share/keyrings/lazynet.gpg] http://127.0.0.1:8080 stable main" |
            sudo tee /etc/apt/sources.list.d/lazynet.list
          sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/lazynet.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y lazynet
          lazynet version
          test -f /usr/share/doc/lazynet/NOTICE
          test -f /usr/share/bash-completion/completions/lazynet
      - name: install.sh from a local copy of the release layout
        run: |
          ver=$(jq -r .version dist/metadata.json)
          mkdir -p "_rel/download/v$ver"
          cp "dist/lazynet_${ver}_linux_amd64.tar.gz" dist/checksums.txt "_rel/download/v$ver/"
          python3 -m http.server 8081 --bind 127.0.0.1 --directory _rel >/dev/null 2>&1 &
          sleep 1
          LAZYNET_BASE_URL=http://127.0.0.1:8081 LAZYNET_VERSION="$ver" LAZYNET_INSTALL_DIR="$HOME/bin" sh scripts/install.sh
          "$HOME/bin/lazynet" version
