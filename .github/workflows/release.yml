# Push a tag like v0.1.0 to publish a release:
#   git tag -a v0.1.0 -m "lazynet v0.1.0" && git push origin v0.1.0
#
# To (re)publish an existing release to the APT repository without building
# again, run this workflow manually (Actions > release > Run workflow) with
# the release tag.
#
# Required repository secrets for the APT repository:
#   APT_GPG_PRIVATE_KEY  ASCII-armored private key used to sign the repo
#   APT_GPG_PASSPHRASE   its passphrase (may be empty)
# After the first release: Settings > Pages > Deploy from a branch > gh-pages / (root).
# The repository itself is built by scripts/build-apt-repo.sh. See docs/releasing.md.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to the APT repository (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apt-repo:
    needs: goreleaser
    # Runs after a successful build, or on its own for workflow_dispatch
    # (where the goreleaser job is skipped).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    # Never let two publishes race on the gh-pages branch.
    concurrency:
      group: apt-repo
      cancel-in-progress: false
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # The source must be checked out at the workspace root:
      # actions-gh-pages runs git commands there.
      - uses: actions/checkout@v4
      - name: Download the .deb packages from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern '*.deb' --dir debs
      - name: Fetch the published repository (keeps previous versions)
        run: |
          mkdir -p _site
          set +e
          git ls-remote --exit-code --heads origin gh-pages >/dev/null
          rc=$?
          set -e
          case $rc in
            0) git fetch --depth 1 origin gh-pages && git archive FETCH_HEAD | tar -x -C _site ;;
            2) echo "No gh-pages branch yet: this is the first publication." ;;
            *) echo "could not query gh-pages (exit $rc)"; exit "$rc" ;;
          esac
      - name: Install apt-ftparchive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
      - name: Import the signing key
        env:
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          echo "APT_GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build and sign the APT repository
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: sh scripts/build-apt-repo.sh debs _site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          keep_files: true # extra safety: never drop files already published
          commit_message: "apt: publish ${{ env.TAG }}"
