# Push a tag like v0.2.0 to publish a release:
#   git tag -a v0.2.0 -m "lazynet v0.2.0" && git push origin v0.2.0
#
# GoReleaser builds the tarballs, .deb, .rpm and checksums.txt and creates the
# GitHub release. The install script and `lazynet update` download from it.
# See docs/releasing.md.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The release notes are the tag's CHANGELOG.md section. This step fails
      # when it is missing, so nothing is published without notes. The same
      # text is embedded in the binary and shown by the TUI after an update.
      - name: Release notes from CHANGELOG.md
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
