# Push a tag like v0.1.0 to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required repository secrets for the APT repository:
#   APT_GPG_PRIVATE_KEY  ASCII-armored private key used to sign the repo
#   APT_GPG_PASSPHRASE   its passphrase (may be empty)
# After the first release: Settings > Pages > Deploy from a branch > gh-pages / (root).
# The repository itself is built by scripts/build-apt-repo.sh.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb

  apt-repo:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Check out gh-pages (keeps previous versions)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo
        continue-on-error: true # first release: branch does not exist yet
      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: debs
      - name: Install apt-ftparchive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
      - name: Import the signing key
        env:
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          echo "APT_GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build and sign the APT repository
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: sh src/scripts/build-apt-repo.sh debs repo
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: repo
          publish_branch: gh-pages
          keep_files: true
          exclude_assets: ".git"
