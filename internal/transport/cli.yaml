# Base CLI definition used for every lazynet session. The prompt patterns are
# generic ("name>", "name#", "name(config…)#", with '@', '.', '/' and ':'
# allowed in the name), so one session can detect any registered platform.
# No on-open commands: lazynet checks the prompt itself (see Dial).
#
# failed-when-contains is filled at runtime from the registered platforms
# (transport.Dialect), so this file names no vendor.
platform-type: 'lazynet_cli'
default:
  driver-type: 'network'
  privilege-levels:
    exec:
      name: 'exec'
      pattern: '(?im)^[\w.\-@/:]{1,63}(?:\([\w\-]{1,24}\))?>\s?$'
      previous-priv:
      deescalate:
      escalate:
      escalate-auth: false
      escalate-prompt:
    privilege-exec:
      name: 'privilege-exec'
      pattern: '(?im)^[\w.\-@/:]{1,63}#\s?$'
      previous-priv: 'exec'
      deescalate: 'disable'
      escalate: 'enable'
      escalate-auth: true
      escalate-prompt: '(?im)^(?:enable\s){0,1}password:\s?$'
    configuration:
      name: 'configuration'
      pattern: '(?im)^[\w.\-@/:]{1,63}\(config[\w.\-@/:+]{0,32}\)#\s?$'
      not-contains:
        - 'tcl)'
        - 'config-s'
      previous-priv: 'privilege-exec'
      deescalate: 'end'
      escalate: 'configure terminal'
      escalate-auth: false
      escalate-prompt:
  default-desired-privilege-level: 'privilege-exec'
  failed-when-contains: []
