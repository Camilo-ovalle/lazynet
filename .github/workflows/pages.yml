# Builds and deploys the landing page, https://camilo-ovalle.github.io/lazynet
# (Astro, site/), with terminal recordings made by VHS.
# It requires Settings > Pages > Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build lazynet for the recordings
        run: |
          mkdir -p "$HOME/.local/bin"
          CGO_ENABLED=0 go build -o "$HOME/.local/bin/lazynet" ./cmd/lazynet
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Recordings are optional: if VHS fails, the site falls back to the
      # static mockups instead of blocking the deploy.
      - name: Install VHS
        id: vhs
        continue-on-error: true
        uses: charmbracelet/vhs-action@v2
        with:
          install-fonts: "true"
      - name: Record the terminal demos
        if: steps.vhs.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p site/public/media
          for tape in tui vlan; do vhs "site/tapes/$tape.tape"; done
          ls -lh site/public/media
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the site
        working-directory: site
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
