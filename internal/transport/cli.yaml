# Unified platform used for every lazynet session. Prompt patterns cover IOS,
# IOS-XE, NX-OS, ASA and PAN-OS, so a single session can detect the platform
# and then apply the right paging settings. No on-open commands: lazynet checks
# the prompt itself. A '>' prompt is only accepted for PAN-OS operational mode
# ("user@host>"); on Cisco it means user EXEC and the login is refused.
platform-type: 'lazynet_cli'
default:
  driver-type: 'network'
  privilege-levels:
    exec:
      name: 'exec'
      pattern: '(?im)^[\w.\-@/:]{1,63}(?:\([\w\-]{1,24}\))?>\s?$'
      previous-priv:
      deescalate:
      escalate:
      escalate-auth: false
      escalate-prompt:
    privilege-exec:
      name: 'privilege-exec'
      pattern: '(?im)^[\w.\-@/:]{1,63}#\s?$'
      previous-priv: 'exec'
      deescalate: 'disable'
      escalate: 'enable'
      escalate-auth: true
      escalate-prompt: '(?im)^(?:enable\s){0,1}password:\s?$'
    configuration:
      name: 'configuration'
      pattern: '(?im)^[\w.\-@/:]{1,63}\(config[\w.\-@/:+]{0,32}\)#\s?$'
      not-contains:
        - 'tcl)'
        - 'config-s'
      previous-priv: 'privilege-exec'
      deescalate: 'end'
      escalate: 'configure terminal'
      escalate-auth: false
      escalate-prompt:
  default-desired-privilege-level: 'privilege-exec'
  failed-when-contains:
    - '% Ambiguous command'
    - '% Incomplete command'
    - '% Invalid input detected'
    - '% Unknown command'
    - '% Invalid command'
    - 'ERROR: %'
    - '% Authorization failed'
    - 'Invalid syntax.'
    - 'Unknown command:'
    - 'Server error :'
