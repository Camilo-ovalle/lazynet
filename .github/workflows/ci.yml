name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: build (static)
        run: CGO_ENABLED=0 go build -trimpath -o lazynet ./cmd/lazynet && ./lazynet version
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: release notes script
        run: sh scripts/release-notes.sh v0.1.0 >/dev/null

  # Builds every package with GoReleaser (snapshot, nothing is published) and
  # installs lazynet the way users will: with install.sh (install, rerun and
  # update in place) and from the .deb. Catches packaging problems before a
  # release.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: install.sh from a local copy of the release layout
        run: |
          ver=$(jq -r .version dist/metadata.json)
          mkdir -p "_rel/download/v$ver"
          cp "dist/lazynet_${ver}_linux_amd64.tar.gz" dist/checksums.txt "_rel/download/v$ver/"
          python3 -m http.server 8081 --bind 127.0.0.1 --directory _rel >/dev/null 2>&1 &
          sleep 1
          export LAZYNET_BASE_URL=http://127.0.0.1:8081 LAZYNET_VERSION="$ver"
          # Fresh install into a chosen directory.
          LAZYNET_INSTALL_DIR="$HOME/bin" sh scripts/install.sh
          "$HOME/bin/lazynet" version | grep -F "lazynet $ver "
          # Rerun: an existing install in PATH is found and left alone.
          PATH="$HOME/bin:$PATH" sh scripts/install.sh | tee out.txt
          grep -F "already installed in $HOME/bin" out.txt
          # Update: an older lazynet in PATH is replaced where it is.
          mkdir -p "$HOME/old"
          printf '#!/bin/sh\necho "lazynet 0.0.1 (commit x, built y)"\n' > "$HOME/old/lazynet"
          chmod 0755 "$HOME/old/lazynet"
          PATH="$HOME/old:$PATH" sh scripts/install.sh | tee out.txt
          grep -F "updated from 0.0.1 to $ver in $HOME/old/lazynet" out.txt
          "$HOME/old/lazynet" version | grep -F "lazynet $ver "
      - name: .deb package
        run: |
          sudo dpkg -i dist/lazynet_*_linux_amd64.deb
          /usr/bin/lazynet version
          test -f /usr/share/doc/lazynet/NOTICE
          test -f /usr/share/doc/lazynet/CHANGELOG.md
          test -f /usr/share/bash-completion/completions/lazynet

  # The landing page must always build (recordings are only made on deploy).
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
